name: Deploy NodeJS Application

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test SSH connectivity
        run: |
          echo "Testing ${{ secrets.HOST }}:22"
          timeout 10 bash -c "</dev/tcp/${{ secrets.HOST }}/22" \
          && echo "Port 22 is reachable" \
          || echo "Port 22 is NOT reachable"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: cd /root/nodejs-application-deploy-github-actions
            git pull
            docker compose up -d --build
